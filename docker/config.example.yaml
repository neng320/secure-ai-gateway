server:
  # 监听面隔离（P1-01F）：
  #   host/port —— Public API（仅 API+health；生产置于反向代理之后，推荐 127.0.0.1）
  #   admin     —— 管理面 /admin /setup /swagger（默认 127.0.0.1:8091，经 SSH 隧道 / Tailscale 访问）
  #   metrics   —— /metrics（默认 127.0.0.1:9090，仅 prometheus.enabled=true 时启动）
  # Admin/Metrics 绝不默认公网；如需改动，自行承担暴露风险。
  host: 0.0.0.0
  port: 8090
  # ⚠️ Deprecated (ADR-005)：网关不再内建 TLS，此段仅为旧配置兼容。
  # enabled=true 将拒绝启动。TLS 由反向代理（Caddy）终止：Caddy HTTPS → 127.0.0.1:<api port> HTTP
  https:
    enabled: false
    cert_file: ""
    key_file: ""
  admin:
    host: 127.0.0.1
    port: 8091
  metrics:
    host: 127.0.0.1
    port: 9090
admin:

  # Admin 会话 Cookie 的 Secure 属性（与已废弃的 server.https 解耦）
  # 容器场景若经 HTTPS 反代访问 Admin 面，请显式置 true
  cookie_secure: false
  username: admin
  # Bcrypt hash of the admin password.
  # Generate with:  docker run --rm <image> hashpw 'your-password'
  # Or set ADMIN_PASSWORD env var and the entrypoint will fill this in.
  # Leave as __SETUP_REQUIRED__ to use the web-based setup wizard on first boot.
  password_hash: "__SETUP_REQUIRED__"
  # Random hex string used to sign session cookies.
  # Generate with:  openssl rand -hex 16
  # If left empty the app will auto-generate one (requires writable config).
  session_secret: ""

