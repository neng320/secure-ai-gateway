server:
  # 监听面隔离（P1-01F）：
  #   host/port —— Public API（仅 API+health；生产置于反向代理之后，推荐 127.0.0.1）
  #   admin     —— 管理面 /admin /setup /swagger（默认 127.0.0.1:8091，经 SSH 隧道 / Tailscale 访问）
  #   metrics   —— /metrics（默认 127.0.0.1:9090，仅 prometheus.enabled=true 时启动）
  # Admin/Metrics 绝不默认公网；如需改动，自行承担暴露风险。
  host: 127.0.0.1
  port: 8090
  # ⚠️ Deprecated (ADR-005)：网关不再内建 TLS，此段仅为旧配置兼容。
  # enabled=true 将拒绝启动。TLS 由反向代理（Caddy）终止：Caddy HTTPS → 127.0.0.1:<api port> HTTP
  https:
    enabled: false
    cert_file: ""
    key_file: ""
  admin:
    host: 127.0.0.1
    port: 8091
  metrics:
    host: 127.0.0.1
    port: 9090
admin:
  username: admin
  # password_hash and session_secret are auto-generated on first run
  # Admin 会话 Cookie 的 Secure 属性（与已废弃的 server.https 解耦）：
  #   false —— loopback / SSH 隧道的纯 HTTP 开发访问（默认）
  #   true  —— 生产经 HTTPS 访问 Admin 面时必须显式开启
  cookie_secure: false
  # 登录防爆破（P1-02D）：username 维度、本地内存、重启清零
  # login_max_failures: 5
  # login_lockout_minutes: 15

providers:
  gemini:
    type: gemini
    api_key: ""
    default_model: gemini-2.5-flash
    allowed_models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-2.0-flash
    timeout_seconds: 120

  # Uncomment and configure providers as needed:
  #
  # openai:
  #   type: openai
  #   api_key: ""
  #   default_model: gpt-4o
  #   timeout_seconds: 120
  #
