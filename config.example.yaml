server:
  host: 0.0.0.0
  port: 8090
  https:
    enabled: false
    cert_file: ""
    key_file: ""
    # P1-01F 监听面隔离：
    #   admin   —— 管理面（默认 127.0.0.1，生产经 SSH 隧道 / Tailscale 访问）
    #   metrics —— /metrics（默认 127.0.0.1，仅 prometheus.enabled=true 时启动）
    # 两个面绝不默认公网；如需改动，自行承担暴露风险。
    admin:
        host: 127.0.0.1
        port: 8091
    metrics:
        host: 127.0.0.1
        port: 9090


admin:
  username: admin
  # password_hash and session_secret are auto-generated on first run

providers:
  gemini:
    type: gemini
    api_key: ""
    default_model: gemini-2.5-flash
    allowed_models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-2.0-flash
    timeout_seconds: 120

  # Uncomment and configure providers as needed:
  #
  # openai:
  #   type: openai
  #   api_key: ""
  #   default_model: gpt-4o
  #   timeout_seconds: 120
  #
  # anthropic:
  #   type: anthropic
  #   api_key: ""
  #   default_model: claude-sonnet-4-20250514
  #   timeout_seconds: 120
  #
  # mistral:
  #   type: mistral
  #   api_key: ""
  #   default_model: mistral-large-latest
  #
  # perplexity:
  #   type: perplexity
  #   api_key: ""
  #   default_model: sonar-pro
  #
  # xai:
  #   type: xai
  #   api_key: ""
  #   default_model: grok-3
  #
  # cohere:
  #   type: cohere
  #   api_key: ""
  #   default_model: command-r-plus
  #
  # azure:
  #   type: azure-openai
  #   api_key: ""
  #   base_url: https://YOUR_RESOURCE.openai.azure.com
  #   default_model: gpt-4o
  #
  # ollama:
  #   type: ollama
  #   base_url: http://localhost:11434/v1
  #   default_model: llama3.2
  #
  # lmstudio:
  #   type: lmstudio
  #   base_url: http://localhost:1234/v1

defaults:
  rate_limit:
    requests_per_minute: 60
    requests_per_hour: 1000
    requests_per_day: 10000
  quota:
    max_input_tokens_per_day: 1000000
    max_output_tokens_per_day: 500000
    max_requests_per_day: 1000
    max_input_tokens: 1000000
    max_output_tokens: 8192

database:
  path: ./data/gateway.db

logging:
  level: info
  file: ./logs/gateway.log
