name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt（仅检查 Git 跟踪的 Go 文件）
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "::error::以下文件需要 gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # mattn/go-sqlite3 需要 CGO；ubuntu-latest 自带 gcc
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test ./...

  security:
    name: Secret Scan & Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Large file check
        run: bash scripts/check-large-files.sh

      # P1-03B.1 防回归：敏感基础设施包必须真实入库并被构建（防 gitignore 吞包的 CI coverage illusion）
      - name: Critical package delivery guard
        run: |
          files=$(git ls-files 'internal/secrets/*.go')
          if [ -z "$files" ]; then
            echo "::error::internal/secrets source files are NOT tracked in git"
            exit 1
          fi
          echo "tracked internal/secrets files:"
          echo "$files"
          if ! go list ./... | grep -q '^ai-gateway/internal/secrets$'; then
            echo "::error::ai-gateway/internal/secrets missing from package list"
            exit 1
          fi
          echo "package delivery guard OK"
